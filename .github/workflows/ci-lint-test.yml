name: CI - Lint & Test

on:
  push:
    branches: [ main, develop, feat/golden-hour-emergency ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Validate frozen install
        run: pnpm install --frozen-lockfile

      - name: Synchronize generated lockfile on feature branch
        if: github.ref_name == 'feat/golden-hour-emergency'
        run: |
          cp pnpm-lock.yaml "$RUNNER_TEMP/generated-pnpm-lock.yaml"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_HEAD_REF"
            git checkout -f "$GITHUB_HEAD_REF"
          fi
          cp "$RUNNER_TEMP/generated-pnpm-lock.yaml" pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "chore(deps): synchronize pnpm lockfile"
          git push origin "HEAD:feat/golden-hour-emergency"

      - name: Run ESLint
        run: pnpm lint

      - name: Run test suite
        run: pnpm exec vitest run

      - name: Run TypeScript type checking
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Show build summary
        run: |
          echo "Lint passed"
          echo "Test suite passed"
          echo "TypeScript passed"
          echo "Tests passed"
          echo "Build succeeded"
